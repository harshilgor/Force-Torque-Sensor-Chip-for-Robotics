[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ftfusion"
version = "0.1.0"
description = "Reference models for a force/torque sensor-fusion FPGA coprocessor"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
ftfusion-benchmark = "ftfusion.cli:main"
ftfusion-calibrate = "ftfusion.calibration_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
